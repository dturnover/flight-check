name: Flight Watch
on:
  schedule:
    - cron: '17 6,14,22 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: Operation (observe makes live searches without sending)
        required: true
        default: health
        type: choice
        options: [health, baseline, observe, test-delivery, receipts, monitor, stop]
permissions:
  contents: write
concurrency:
  group: flight-watch-single-writer
  cancel-in-progress: false
jobs:
  watch:
    # Baseline collection is independent of notification activation.
    # The owner accepted a public repository, so the state branch is public too.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: .private-state
      - name: Load or initialize private state branch
        working-directory: .private-state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Flight Watch'
          git config user.email 'flight-watch@users.noreply.github.com'
          status=0
          git ls-remote --exit-code origin refs/heads/state > /dev/null || status=$?
          if [ "$status" = 0 ]; then
            git fetch origin state
            git switch -C state FETCH_HEAD
          elif [ "$status" = 2 ]; then
            git switch --orphan state
          else
            exit "$status"
          fi
      - name: Run Flight Watch
        env:
          COMMAND: ${{ inputs.command || 'scheduled' }}
          FLIGHT_WATCH_ENABLED: ${{ vars.FLIGHT_WATCH_ENABLED }}
          ALLOW_UNKNOWN_PROTECTION: ${{ vars.ALLOW_UNKNOWN_PROTECTION }}
          MESSAGING_COST_APPROVED: ${{ vars.MESSAGING_COST_APPROVED }}
          SERPAPI_KEY: ${{ secrets.SERPAPI }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_PHONE: ${{ secrets.ALERT_PHONE }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          c = json.loads(Path('config.json').read_text())
          c['enabled'] = os.environ.get('FLIGHT_WATCH_ENABLED') == 'true'
          p = os.environ.get('ALLOW_UNKNOWN_PROTECTION')
          c['allow_unknown_protection'] = {'true': True, 'false': False}.get(p)
          Path('/tmp/flight-watch-config.json').write_text(json.dumps(c))
          PY
          python -m flight_watch "$COMMAND" --config /tmp/flight-watch-config.json --state-dir .private-state --persist-git
